workflows:
  chaini-android:
    name: Chaini AI APK - Final Launch Safe
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Release Bundle and Debug APK
        script: |
          set -e
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew bundleRelease assembleDebug --stacktrace --no-daemon
          else
            gradle bundleRelease assembleDebug --stacktrace --no-daemon
          fi
      - name: Verify APK
        script: |
          set -e
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi
          echo "APK ready: $APK"
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/apk/debug/*.apk
