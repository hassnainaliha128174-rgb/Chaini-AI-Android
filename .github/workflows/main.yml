name: Build Chaini AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android project
        shell: bash
        run: |
          set -e

          rm -rf android_project
          mkdir -p android_project

          echo "Searching for Android project ZIP..."

          ZIP_FILE=""

          while IFS= read -r zip; do
            echo "Checking: $zip"

            if unzip -l "$zip" | grep -Eq '(^|/)(settings\.gradle|settings\.gradle\.kts)$'; then
              ZIP_FILE="$zip"
              break
            fi
          done < <(find . -maxdepth 3 -type f -name "*.zip" ! -path "./android_project/*")

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android project ZIP containing settings.gradle was found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          unzip -q "$ZIP_FILE" -d android_project

          echo "Android project extracted."

      - name: Find Android Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(find "$GITHUB_WORKSPACE/android_project" \
            -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android Manifest
        shell: bash
        run: |
          set -e

          echo "Checking AndroidManifest.xml files..."

          python3 - <<'PY'
          import os
          import re

          root = os.environ["PROJECT_DIR"]

          for base, dirs, files in os.walk(root):
              for filename in files:
                  if filename == "AndroidManifest.xml":
                      path = os.path.join(base, filename)

                      with open(path, "r", encoding="utf-8") as f:
                          text = f.read()

                      # Remove duplicate usesCleartextTraffic attributes,
                      # keeping the first occurrence.
                      pattern = r'\s+android:usesCleartextTraffic\s*=\s*"[^"]*"'
                      matches = list(re.finditer(pattern, text))

                      if len(matches) > 1:
                          first_end = matches[0].end()
                          prefix = text[:first_end]
                          suffix = text[first_end:]

                          suffix = re.sub(pattern, "", suffix)

                          text = prefix + suffix

                          with open(path, "w", encoding="utf-8") as f:
                              f.write(text)

                          print("Fixed duplicate usesCleartextTraffic:", path)
                      else:
                          print("Manifest OK:", path)
          PY

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "./gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x ./gradlew

          if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip#' \
              gradle/wrapper/gradle-wrapper.properties
          fi

          echo "Gradle wrapper prepared."

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Chaini-AI-Debug-APK
          path: ${{ env.PROJECT_DIR }}/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
